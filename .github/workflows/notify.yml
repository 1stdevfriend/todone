name: Notify

# Sends due push reminders: calls the web app's /api/cron/notify every 10 minutes (GitHub runs
# scheduled jobs on a best-effort basis, so a run can be a few minutes late; reminders allow for that).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Call the reminder endpoint
        env:
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: |
          if [ -z "$NOTIFY_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::NOTIFY_URL or CRON_SECRET is not set; no reminders sent"
            exit 0
          fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" ${BYPASS:+-H "x-vercel-protection-bypass: $BYPASS"} "$NOTIFY_URL"
