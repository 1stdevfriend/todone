name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  cli:
    # test.sh drives the TUI through macOS `script` and BSD `date`.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh test.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
